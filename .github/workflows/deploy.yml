name: Deploy to Hostinger Production

on:
  push:
    branches:
      - master
      - teklito_dev # Triggers on dev as well for testing

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Setup PHP for Backend
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Hostinger standard
          tools: composer:v2
          
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          composer install --optimize-autoloader --no-dev

      - name: Prepare Hostinger Structure
        run: |
          mkdir _deployment
          
          # 1. Copy the backend (and remove its gitignore so /vendor is pushed)
          cp -r backend _deployment/
          rm -f _deployment/backend/.gitignore
          
          # 2. Copy the compiled frontend explicitly into a frontend folder
          mkdir -p _deployment/frontend
          cp -r frontend/dist _deployment/frontend/
          
          # 3. Create intelligent routing at the domain root
          cat << 'EOF' > _deployment/.htaccess
          <IfModule mod_rewrite.c>
              RewriteEngine On
              
              # If the request starts with /api, pass it strictly to the Laravel index
              RewriteCond %{REQUEST_URI} ^/api [NC]
              RewriteRule ^(.*)$ backend/public/$1 [L]

              # If requesting an asset or static file in the frontend (e.g. /assets/js)
              RewriteCond %{DOCUMENT_ROOT}/frontend/dist/$1 -f [OR]
              RewriteCond %{DOCUMENT_ROOT}/frontend/dist/$1 -d
              RewriteRule ^(.*)$ frontend/dist/$1 [L]

              # For any other web route (React Single Page App fallback), serve index.html
              # This ensures refreshing /cart or /products doesn't crash Apache
              RewriteCond %{REQUEST_URI} !^/api [NC]
              RewriteCond %{REQUEST_URI} !^/backend/ [NC]
              RewriteRule ^(.*)$ frontend/dist/index.html [L]
          </IfModule>
          EOF

      - name: Configure Git Bot
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Push to Production Branch
        run: |
          # Clone the current repository so we have its git history
          git clone --branch production https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git prod_branch || git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git prod_branch
          
          cd prod_branch
          git checkout -B production
          
          # Wipe everything inside except the hidden .git directory to keep history
          find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name '..' -exec rm -rf {} +
          
          # Copy the newly built files over
          cp -r ../_deployment/* ./
          cp -r ../_deployment/.[!.]* ./ 2>/dev/null || true
          
          # Commit normally so Hostinger can fast-forward pull
          git add .
          git commit -m "🚀 Auto-build & Compilation: ${GITHUB_SHA::7}" || echo "No changes to commit"
          git push origin production
