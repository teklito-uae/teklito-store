name: Deploy to Hostinger Production

on:
  push:
    branches:
      - master
      - teklito_dev # Triggers on dev as well for testing

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Setup PHP for Backend
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Hostinger standard
          tools: composer:v2
          
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          composer install --optimize-autoloader --no-dev
          php artisan package:discover --ansi || true

      - name: Prepare Hostinger Structure
        run: |
          mkdir _deployment
          
          # 1. Copy the backend (and remove its gitignore so /vendor is pushed)
          cp -r backend _deployment/
          rm -f _deployment/backend/.gitignore
          
          # 2. Copy the compiled frontend explicitly into a frontend folder
          mkdir -p _deployment/frontend
          cp -r frontend/dist _deployment/frontend/
          
          cat << 'EOF' > _deployment/.htaccess
          <IfModule mod_rewrite.c>
              RewriteEngine On

              # 1. API requests → Laravel backend
              RewriteCond %{REQUEST_URI} ^/api [NC]
              RewriteRule ^(.*)$ backend/public/$1 [L]

              # 2. Backend public static files (sitemap.xml, robots.txt, storage/*, etc.)
              #    If the file physically exists in backend/public/, serve it directly
              RewriteCond %{DOCUMENT_ROOT}/backend/public/$1 -f
              RewriteRule ^(.*)$ backend/public/$1 [L]

              # 3. Frontend static assets (JS, CSS, images in dist/)
              RewriteCond %{DOCUMENT_ROOT}/frontend/dist/$1 -f [OR]
              RewriteCond %{DOCUMENT_ROOT}/frontend/dist/$1 -d
              RewriteRule ^(.*)$ frontend/dist/$1 [L]

              # 4. Everything else → React SPA fallback (client-side routing)
              RewriteCond %{REQUEST_URI} !^/api [NC]
              RewriteCond %{REQUEST_URI} !^/backend/ [NC]
              RewriteRule ^(.*)$ frontend/dist/index.html [L]
          </IfModule>
          EOF

          # 4. Inject production secrets into the backend .env
          #    This ensures the server always has the correct values regardless of
          #    what was previously on the Hostinger server.
          ENV_FILE="_deployment/backend/.env"
          if [ -f "$ENV_FILE" ]; then
            # Remove any existing SITEMAP_KEY line and append the production value
            sed -i '/^SITEMAP_KEY=/d' "$ENV_FILE"
            echo "SITEMAP_KEY=${{ secrets.SITEMAP_KEY }}" >> "$ENV_FILE"
            echo "✅ SITEMAP_KEY injected into production .env"
          else
            echo "⚠️  .env file not found at $ENV_FILE — skipping injection"
          fi

      - name: Configure Git Bot
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Push to Production Branch
        run: |
          # Clone the current repository so we have its git history
          git clone --branch production https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git prod_branch || git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git prod_branch
          
          cd prod_branch
          git checkout -B production
          
          # Wipe everything inside except the hidden .git directory to keep history
          find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name '..' -exec rm -rf {} +
          
          # Copy the newly built files over
          cp -r ../_deployment/* ./
          cp -r ../_deployment/.[!.]* ./ 2>/dev/null || true
          
          # Commit normally so Hostinger can fast-forward pull
          git add .
          git commit -m "🚀 Auto-build & Compilation: ${GITHUB_SHA::7}" || echo "No changes to commit"
          git push origin production

      - name: Regenerate Sitemap on Production
        run: |
          echo "Triggering sitemap regeneration on teklito.store..."
          curl -s --max-time 30 \
            "https://teklito.store/api/generate-sitemap/${{ secrets.SITEMAP_KEY }}" \
            -o /tmp/sitemap_response.json \
            && cat /tmp/sitemap_response.json \
            || echo "⚠️  Sitemap generation failed (non-blocking — check manually)"
